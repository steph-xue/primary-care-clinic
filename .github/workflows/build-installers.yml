name: Build Installers

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Determine app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Compile sources and build runnable jar
        shell: bash
        run: |
          mkdir -p build/classes build/input
          javac -cp "lib/*" -d build/classes $(find src/main/java -name "*.java")
          cp -r src/main/resources/* build/classes/
          (cd build/classes && jar xf ../../lib/json-20240303.jar && rm -rf META-INF)
          jar --create --file build/input/PrimaryCareClinic.jar \
              --main-class ui.gui.MainUI -C build/classes .

      - name: Package and sign macOS app
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          jpackage \
            --input build/input \
            --main-jar PrimaryCareClinic.jar \
            --main-class ui.gui.MainUI \
            --name "PrimaryCareClinic" \
            --app-version "$APP_VERSION" \
            --type app-image \
            --dest build/dist

          codesign --force --deep -s - "build/dist/PrimaryCareClinic.app"

          hdiutil create -volname "PrimaryCareClinic" \
            -srcfolder "build/dist/PrimaryCareClinic.app" \
            -ov -format UDZO "build/dist/PrimaryCareClinic-mac.dmg"

      - name: Package Windows app image
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          jpackage \
            --input build/input \
            --main-jar PrimaryCareClinic.jar \
            --main-class ui.gui.MainUI \
            --name "PrimaryCareClinic" \
            --app-version "$APP_VERSION" \
            --type app-image \
            --dest build/dist
          cd build/dist && 7z a -tzip "PrimaryCareClinic-windows.zip" "PrimaryCareClinic"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimaryCareClinic-${{ matrix.platform }}
          path: |
            build/dist/*.dmg
            build/dist/*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/*.dmg
            build/dist/*.zip
